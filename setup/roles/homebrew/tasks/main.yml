- block:

  - name: homebrew update/upgrade
    homebrew:
      path: /opt/homebrew/bin:/usr/local/bin
      update_homebrew: true
      upgrade_all: yes

  - name: homebrew tap
    homebrew_tap:
      name: "{{ item }}"
      state: present
    loop: "{{ taps }}"

  - name: homebrew install
    homebrew:
      path: /opt/homebrew/bin:/usr/local/bin
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"

  tags:
    - homebrew
